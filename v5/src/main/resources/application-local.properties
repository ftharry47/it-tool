# local profile:
# This profile is intended ONLY for local UI preview without a real
# Microsoft Entra tenant. It disables the default JWT issuer lookup and
# activates LocalAuthConfig, which provides a fixed-token decoder and
# seeds local-admin (SUPER_ADMIN) and local-user (END_USER).
#
# DO NOT SET THIS PROFILE IN PRODUCTION AZURE APPLICATION SETTINGS.

spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=
