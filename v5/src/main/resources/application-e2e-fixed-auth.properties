# e2e-fixed-auth profile:
# This profile is intended ONLY for Playwright end-to-end testing.
# It replaces the Microsoft Entra JWT decoder with a fixed-token decoder
# and seeds two deterministic test users.
#
# DO NOT SET THIS PROFILE IN PRODUCTION AZURE APPLICATION SETTINGS.

spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=
