spring.application.name=itsm-portal
server.port=8080

# Database (Azure App Service Application Settings)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/itsm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:itsm}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:itsm}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Entra ID placeholders (fill in Azure Application Settings in Phase 1)
# SPA uses MSAL directly; backend validates Bearer tokens from the resource-server below.

# JWT resource-server (SPA sends Bearer tokens from MSAL)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:common}/v2.0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:common}/discovery/v2.0/keys

# Application base URL
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Attachments: local fallback path; set AZURE_STORAGE_CONNECTION_STRING to use Azure Blob instead
attachment.store.path=${ATTACHMENT_STORE_PATH:target/attachments}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}

# Redis (off until Phase 9)
spring.data.redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# SMTP placeholders (until Phase 9)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=INFO
