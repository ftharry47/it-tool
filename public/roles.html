<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Role Permissions - IT Support</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>* { font-family: 'Inter', sans-serif; } body { background: #f8fafc; } .chip { cursor: pointer; }</style>
</head>
<body class="min-h-screen p-6">
  <main class="max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-100 flex items-center justify-center text-blue-700">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <h1 class="text-2xl font-bold text-slate-900">Role Permissions</h1>
      </div>
      <a href="/admin" class="text-blue-700 hover:underline text-sm font-medium">Admin</a>
    </div>

    <div id="loading" class="text-slate-500 text-sm mb-4">Loading permissions...</div>

    <div id="grid" class="space-y-6 hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h2 class="text-sm font-semibold text-slate-700 mb-3">Select a role</h2>
        <div id="roleList" class="flex flex-wrap gap-2"></div>
      </div>

      <div id="editor" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h2 class="text-lg font-semibold text-slate-900 mb-1" id="roleTitle">Role</h2>
        <p class="text-sm text-slate-500 mb-4">Toggle permission resources. Use <code>*</code> for full access, or wildcards like <code>tickets.*</code>.</p>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6" id="resourceGrid">
          <label class="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" value="*" class="rounded border-slate-300"> <span>All (*)</span></label>
          <label class="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" value="tickets.*" class="rounded border-slate-300"> <span>Tickets all</span></label>
          <label class="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" value="tickets.read" class="rounded border-slate-300"> <span>Tickets read</span></label>
          <label class="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" value="tickets.update.status" class="rounded border-slate-300"> <span>Tickets status</span></label>
          <label class="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" value="tickets.update.assign" class="rounded border-slate-300"> <span>Tickets assign</span></label>
          <label class="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" value="tickets.update.note" class="rounded border-slate-300"> <span>Tickets note</span></label>
          <label class="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" value="cmdb.*" class="rounded border-slate-300"> <span>CMDB all</span></label>
          <label class="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" value="workflows.*" class="rounded border-slate-300"> <span>Workflows all</span></label>
          <label class="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" value="users.*" class="rounded border-slate-300"> <span>Users all</span></label>
          <label class="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" value="settings.*" class="rounded border-slate-300"> <span>Settings all</span></label>
          <label class="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" value="settings.read" class="rounded border-slate-300"> <span>Settings read</span></label>
        </div>

        <div class="flex gap-3">
          <button id="saveBtn" class="bg-blue-700 hover:bg-blue-800 text-white font-medium px-5 py-2.5 rounded-xl text-sm">Save Role</button>
          <button id="addCustom" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-5 py-2.5 rounded-xl text-sm">Add custom resource</button>
        </div>
        <div id="msg" class="mt-3 text-sm"></div>
      </div>
    </div>
  </main>

  <script>
    let currentRole = null;
    let permissions = [];

    async function callApi(fn, args) {
      const res = await fetch('/api/' + fn, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ args, user: { name: 'Admin', role: 'Admin' } }) });
      return res.json();
    }

    async function load() {
      const result = await callApi('getAllRolePermissions', []);
      if (!result.success) return;
      permissions = result.permissions;
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('grid').classList.remove('hidden');
      const list = document.getElementById('roleList');
      list.innerHTML = '';
      permissions.forEach(p => {
        const btn = document.createElement('button');
        btn.textContent = p.role;
        btn.className = 'roleBtn bg-white border border-slate-200 hover:border-blue-400 text-slate-700 font-medium px-4 py-2 rounded-xl text-sm';
        btn.dataset.role = p.role;
        list.appendChild(btn);
      });
      list.querySelectorAll('.roleBtn').forEach(b => b.addEventListener('click', () => selectRole(b.dataset.role)));
    }

    function selectRole(role) {
      currentRole = role;
      document.getElementById('editor').classList.remove('hidden');
      document.getElementById('roleTitle').textContent = role + ' Permissions';
      const perms = permissions.find(p => p.role === role)?.resources || [];
      document.getElementById('resourceGrid').querySelectorAll('input[type="checkbox"]').forEach(cb => { cb.checked = perms.includes(cb.value); });
      document.getElementById('msg').textContent = '';
    }

    async function save() {
      if (!currentRole) return;
      const resources = Array.from(document.getElementById('resourceGrid').querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
      if (resources.includes('*')) {
        const ok = confirm('Selecting "*" grants full access. Continue?');
        if (!ok) return;
      }
      const result = await callApi('setRolePermissions', [currentRole, resources]);
      const pIdx = permissions.findIndex(p => p.role === currentRole);
      if (pIdx >= 0) permissions[pIdx].resources = resources;
      else permissions.push({ role: currentRole, resources });
      const msg = document.getElementById('msg');
      msg.textContent = result.success ? 'Saved.' : (result.error || 'Failed');
      msg.className = 'mt-3 text-sm ' + (result.success ? 'text-green-600' : 'text-red-600');
    }

    document.getElementById('saveBtn').addEventListener('click', save);
    document.getElementById('addCustom').addEventListener('click', () => {
      const val = prompt('Enter custom resource string (e.g. reports.export):');
      if (!val) return;
      const grid = document.getElementById('resourceGrid');
      const label = document.createElement('label');
      label.className = 'flex items-center gap-2 text-sm text-slate-700';
      label.innerHTML = `<input type="checkbox" value="${val}" checked class="rounded border-slate-300"> <span>${val}</span>`;
      grid.appendChild(label);
    });

    load();
  </script>
</body>
</html>
