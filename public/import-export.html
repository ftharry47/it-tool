<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import / Export - IT Support</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>* { font-family: 'Inter', sans-serif; } body { background: #f8fafc; }</style>
</head>
<body class="min-h-screen p-6">
  <main class="max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-100 flex items-center justify-center text-blue-700">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </div>
        <h1 class="text-2xl font-bold text-slate-900">Import / Export</h1>
      </div>
      <a href="/admin" class="text-blue-700 hover:underline text-sm font-medium">Admin</a>
    </div>

    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
      <h2 class="text-lg font-semibold text-slate-900 mb-4">Export</h2>
      <div class="grid md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Status filter</label>
          <select id="exportStatus" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"><option value="">All</option><option>Open</option><option>In Progress</option><option>On Hold</option><option>Differ</option><option>Resolved</option></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Priority filter</label>
          <select id="exportPriority" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm"><option value="">All</option><option>Pending</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
        </div>
      </div>
      <div class="flex gap-3">
        <button id="exportTicketsBtn" class="bg-blue-700 hover:bg-blue-800 text-white font-medium px-4 py-2 rounded-xl text-sm">Export Tickets CSV</button>
        <button id="exportUsersBtn" class="bg-slate-800 hover:bg-slate-900 text-white font-medium px-4 py-2 rounded-xl text-sm">Export Users CSV</button>
      </div>
      <p id="exportMsg" class="mt-3 text-sm text-slate-600"></p>
    </section>

    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
      <h2 class="text-lg font-semibold text-slate-900 mb-4">Import Users</h2>
      <p class="text-sm text-slate-600 mb-4">CSV header: <code>Employee ID, Name, Email</code></p>
      <input type="file" id="userFile" accept=".csv" class="block w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-4" />
      <button id="importUsersBtn" class="bg-green-700 hover:bg-green-800 text-white font-medium px-4 py-2 rounded-xl text-sm">Import Users</button>
      <pre id="userResult" class="mt-3 text-sm text-slate-700 bg-slate-50 p-3 rounded-xl hidden"></pre>
    </section>

    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-lg font-semibold text-slate-900 mb-4">Import Tickets</h2>
      <p class="text-sm text-slate-600 mb-4">Required columns: <code>Name, Email Address, Short Description</code>. Optional columns include <code>Location, Issue Type, Impact Area, Priority, Status, Ticket ID</code>.</p>
      <input type="file" id="ticketFile" accept=".csv" class="block w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-4" />
      <button id="importTicketsBtn" class="bg-green-700 hover:bg-green-800 text-white font-medium px-4 py-2 rounded-xl text-sm">Import Tickets</button>
      <pre id="ticketResult" class="mt-3 text-sm text-slate-700 bg-slate-50 p-3 rounded-xl hidden"></pre>
    </section>
  </main>

  <script>
    async function callApi(fn, args) {
      const res = await fetch('/api/' + fn, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ args }) });
      return res.json();
    }

    function download(filename, text) {
      const el = document.createElement('a');
      el.setAttribute('href', 'data:text/csv;charset=utf-8,' + encodeURIComponent(text));
      el.setAttribute('download', filename);
      el.click();
    }

    document.getElementById('exportTicketsBtn').addEventListener('click', async () => {
      const filters = {};
      const status = document.getElementById('exportStatus').value;
      const priority = document.getElementById('exportPriority').value;
      if (status) filters.status = status;
      if (priority) filters.priority = priority;
      const result = await callApi('exportTickets', [filters]);
      if (result.success && result.csv) {
        download('tickets-' + new Date().toISOString().slice(0,10) + '.csv', result.csv);
        document.getElementById('exportMsg').textContent = 'Exported ' + result.count + ' tickets.';
      } else document.getElementById('exportMsg').textContent = 'Export failed.';
    });

    document.getElementById('exportUsersBtn').addEventListener('click', async () => {
      const result = await callApi('exportUsers', []);
      if (result.success && result.csv) {
        download('users-' + new Date().toISOString().slice(0,10) + '.csv', result.csv);
        document.getElementById('exportMsg').textContent = 'Exported ' + result.count + ' users.';
      } else document.getElementById('exportMsg').textContent = 'Export failed.';
    });

    async function readFile(file) { return new Promise((resolve) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.readAsText(file); }); }

    document.getElementById('importUsersBtn').addEventListener('click', async () => {
      const file = document.getElementById('userFile').files[0];
      if (!file) return;
      const text = await readFile(file);
      const result = await callApi('importUsers', [text, '', 'Admin Import']);
      const el = document.getElementById('userResult');
      el.classList.remove('hidden');
      el.textContent = JSON.stringify(result, null, 2);
    });

    document.getElementById('importTicketsBtn').addEventListener('click', async () => {
      const file = document.getElementById('ticketFile').files[0];
      if (!file) return;
      const text = await readFile(file);
      const result = await callApi('importTickets', [text, 'Admin Import']);
      const el = document.getElementById('ticketResult');
      el.classList.remove('hidden');
      el.textContent = JSON.stringify(result, null, 2);
    });
  </script>
</body>
</html>
