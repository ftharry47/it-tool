<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - IT Support</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>* { font-family: 'Inter', sans-serif; } body { background: #f8fafc; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md text-center bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <div class="w-16 h-16 rounded-2xl bg-blue-100 flex items-center justify-center text-blue-700 mx-auto mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    </div>
    <h1 class="text-xl font-bold text-slate-900 mb-2">You are offline</h1>
    <p class="text-slate-600 text-sm mb-6">The IT Support Portal can't reach the server right now. Some cached pages are still available.</p>
    <div class="space-y-3">
      <a href="/" class="block w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2.5 rounded-xl text-sm">Try portal</a>
      <a href="/kb" class="block w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl text-sm">Open Knowledge Base</a>
      <a href="/help-bot" class="block w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl text-sm">Open Help Bot</a>
    </div>
  </div>
</body>
</html>
