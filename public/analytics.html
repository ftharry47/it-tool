<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - IT Support</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>* { font-family: 'Inter', sans-serif; } body { background: #f8fafc; }</style>
</head>
<body class="min-h-screen p-6">
  <main class="max-w-6xl mx-auto">
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-100 flex items-center justify-center text-blue-700">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>
        </div>
        <h1 class="text-2xl font-bold text-slate-900">Analytics</h1>
      </div>
      <a href="/admin" class="text-blue-700 hover:underline text-sm font-medium">Admin</a>
    </div>

    <div id="loading" class="text-slate-500 text-sm mb-6">Loading analytics...</div>

    <div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5"><div class="text-xs font-semibold text-slate-500">Total</div><div id="vTotal" class="text-2xl font-bold text-slate-900">0</div></div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5"><div class="text-xs font-semibold text-slate-500">Open</div><div id="vOpen" class="text-2xl font-bold text-blue-700">0</div></div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5"><div class="text-xs font-semibold text-slate-500">Resolved Today</div><div id="vResolvedToday" class="text-2xl font-bold text-green-700">0</div></div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5"><div class="text-xs font-semibold text-slate-500">Created Today</div><div id="vCreatedToday" class="text-2xl font-bold text-slate-900">0</div></div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5"><div class="text-xs font-semibold text-slate-500">SLA Breached</div><div id="vBreached" class="text-2xl font-bold text-red-700">0</div></div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5"><div class="text-xs font-semibold text-slate-500">SLA At Risk</div><div id="vAtRisk" class="text-2xl font-bold text-amber-600">0</div></div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5"><div class="text-xs font-semibold text-slate-500">Avg Resolution (h)</div><div id="vAvgRes" class="text-2xl font-bold text-slate-900">-</div></div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5"><div class="text-xs font-semibold text-slate-500">CSAT Avg</div><div id="vCSAT" class="text-2xl font-bold text-slate-900">-</div></div>
    </div>

    <div class="grid md:grid-cols-2 gap-6 mb-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">Created vs Resolved (30 days)</h2>
        <canvas id="trendChart" height="200"></canvas>
      </div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">Tickets by Status</h2>
        <canvas id="statusChart" height="200"></canvas>
      </div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">Top Issue Types</h2>
        <ul id="issueList" class="space-y-2 text-sm"></ul>
      </div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">Top Assignees</h2>
        <ul id="assigneeList" class="space-y-2 text-sm"></ul>
      </div>
    </div>
  </main>

  <script>
    async function load() {
      const res = await fetch('/api/getAnalytics', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ args: [] }) });
      const data = await res.json();
      if (!data.success) return;
      const s = data.stats;
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('grid').classList.remove('hidden');
      document.getElementById('vTotal').textContent = s.total;
      document.getElementById('vOpen').textContent = s.open;
      document.getElementById('vResolvedToday').textContent = s.resolvedToday;
      document.getElementById('vCreatedToday').textContent = s.createdToday;
      document.getElementById('vBreached').textContent = s.slaBreached;
      document.getElementById('vAtRisk').textContent = s.slaAtRisk;
      document.getElementById('vAvgRes').textContent = s.avgResolutionHours || '-';
      document.getElementById('vCSAT').textContent = s.satisfactionCount ? s.satisfactionAvg : '-';

      const labels = s.last30Days.map(d => d.date.slice(5));
      new Chart(document.getElementById('trendChart'), {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'Created', data: s.last30Days.map(d => d.created), borderColor: '#2563eb', backgroundColor: '#2563eb', tension: 0.3, pointRadius: 2 },
            { label: 'Resolved', data: s.last30Days.map(d => d.resolved), borderColor: '#16a34a', backgroundColor: '#16a34a', tension: 0.3, pointRadius: 2 }
          ]
        },
        options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { legend: { position: 'top' } } }
      });

      new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: {
          labels: Object.keys(s.byStatus),
          datasets: [{ data: Object.values(s.byStatus), backgroundColor: ['#3b82f6', '#f59e0b', '#64748b', '#06b6d4', '#22c55e'] }]
        },
        options: { responsive: true, plugins: { legend: { position: 'right' } } }
      });

      renderList('issueList', s.topIssueTypes);
      renderList('assigneeList', s.topAssignees);
    }

    function renderList(id, items) {
      const el = document.getElementById(id);
      el.innerHTML = '';
      if (!items || !items.length) { el.innerHTML = '<li class="text-slate-500">No data</li>'; return; }
      items.forEach(([name, count]) => {
        const li = document.createElement('li');
        li.className = 'flex justify-between';
        li.innerHTML = `<span class="text-slate-700 truncate">${name}</span><span class="font-semibold text-slate-900">${count}</span>`;
        el.appendChild(li);
      });
    }

    load();
  </script>
</body>
</html>
