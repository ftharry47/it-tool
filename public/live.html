<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Activity - IT Support</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>* { font-family: 'Inter', sans-serif; } body { background: #f8fafc; }</style>
</head>
<body class="min-h-screen p-6">
  <main class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-green-100 flex items-center justify-center text-green-700">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-slate-900">Live Activity</h1>
          <p class="text-xs text-slate-500">Real-time ticket and system events</p>
        </div>
      </div>
      <a href="/admin" class="text-blue-700 hover:underline text-sm font-medium">Admin</a>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
      <div id="status" class="text-sm text-slate-600 mb-3">Connecting...</div>
      <div id="feed" class="space-y-3 max-h-[70vh] overflow-y-auto"></div>
    </div>
  </main>

  <script>
    const feed = document.getElementById('feed');
    const status = document.getElementById('status');

    function addEntry(e) {
      const div = document.createElement('div');
      div.className = 'rounded-xl border border-slate-100 bg-slate-50 p-3';
      div.innerHTML = `<div class="flex items-center gap-2 mb-1"><span class="inline-flex items-center px-2 py-0.5 rounded-md bg-blue-100 text-blue-700 text-xs font-medium">${e.action}</span><span class="text-xs text-slate-400 ml-auto">${new Date(e.timestamp).toLocaleString()}</span></div>
        <div class="text-sm text-slate-700"><span class="font-medium">${e.performedBy}</span> on <span class="font-medium">${e.targetType} ${e.targetId}</span>${e.details ? ' — ' + e.details : ''}</div>`;
      feed.prepend(div);
      if (feed.children.length > 50) feed.lastChild.remove();
    }

    const evtSource = new EventSource('/api/events');
    evtSource.onopen = () => { status.textContent = 'Connected'; status.className = 'text-sm text-green-600 mb-3'; };
    evtSource.onmessage = (msg) => { try { addEntry(JSON.parse(msg.data)); } catch {} };
    evtSource.onerror = () => { status.textContent = 'Disconnected. Retrying...'; status.className = 'text-sm text-red-600 mb-3'; };
  </script>
</body>
</html>
