<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate Your Support Experience</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #f8fafc; }
    .star { cursor: pointer; transition: transform .1s; color: #cbd5e1; }
    .star.active { color: #f59e0b; fill: #f59e0b; }
    .star:hover { transform: scale(1.1); }
    .hidden { display: none; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <main class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-xl bg-blue-100 flex items-center justify-center text-blue-700">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.12 2.12 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.12 2.12 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.12 2.12 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.12 2.12 0 0 0-.611-1.879L2.16 9.794a.53.53 0 0 1 .294-.906l5.165-.755a2.12 2.12 0 0 0 1.596-1.161l2.31-4.677Z"/></svg>
      </div>
      <h1 class="text-xl font-bold text-slate-900">Rate your support</h1>
    </div>

    <p id="intro" class="text-slate-600 mb-6">How satisfied were you with the resolution of ticket <span id="ticketIdDisplay" class="font-semibold text-slate-900">--</span>?</p>

    <form id="csatForm" class="hidden">
      <div class="flex justify-center gap-2 mb-6" id="starContainer" aria-label="Rating">
        <svg class="star w-10 h-10" data-value="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.12 2.12 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.12 2.12 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.12 2.12 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.12 2.12 0 0 0-.611-1.879L2.16 9.794a.53.53 0 0 1 .294-.906l5.165-.755a2.12 2.12 0 0 0 1.596-1.161l2.31-4.677Z"/></svg>
        <svg class="star w-10 h-10" data-value="2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.12 2.12 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.12 2.12 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.12 2.12 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.12 2.12 0 0 0-.611-1.879L2.16 9.794a.53.53 0 0 1 .294-.906l5.165-.755a2.12 2.12 0 0 0 1.596-1.161l2.31-4.677Z"/></svg>
        <svg class="star w-10 h-10" data-value="3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.12 2.12 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.12 2.12 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.12 2.12 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.12 2.12 0 0 0-.611-1.879L2.16 9.794a.53.53 0 0 1 .294-.906l5.165-.755a2.12 2.12 0 0 0 1.596-1.161l2.31-4.677Z"/></svg>
        <svg class="star w-10 h-10" data-value="4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.12 2.12 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.12 2.12 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.12 2.12 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.12 2.12 0 0 0-.611-1.879L2.16 9.794a.53.53 0 0 1 .294-.906l5.165-.755a2.12 2.12 0 0 0 1.596-1.161l2.31-4.677Z"/></svg>
        <svg class="star w-10 h-10" data-value="5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.12 2.12 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.12 2.12 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.12 2.12 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.12 2.12 0 0 0-.611-1.879L2.16 9.794a.53.53 0 0 1 .294-.906l5.165-.755a2.12 2.12 0 0 0 1.596-1.161l2.31-4.677Z"/></svg>
      </div>
      <input type="hidden" id="rating" value="0">

      <label for="comment" class="block text-sm font-medium text-slate-700 mb-2">Additional comments (optional)</label>
      <textarea id="comment" rows="4" class="w-full rounded-xl border border-slate-200 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Tell us what went well or how we can improve"></textarea>

      <button type="submit" id="submitBtn" class="w-full mt-6 bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-xl transition-colors">Submit Feedback</button>
      <p id="error" class="hidden mt-4 text-sm text-red-600 text-center"></p>
    </form>

    <div id="success" class="hidden text-center py-6">
      <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 text-green-600">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h2 class="text-lg font-bold text-slate-900 mb-2">Thank you!</h2>
      <p class="text-slate-600">Your feedback helps us improve IT support.</p>
    </div>

    <div id="missing" class="hidden text-center py-4">
      <p class="text-red-600 font-medium">No ticket ID provided.</p>
      <a href="/" class="inline-block mt-4 text-blue-700 hover:underline">Return to portal</a>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ticketId = params.get('ticketId');
    const form = document.getElementById('csatForm');
    const stars = document.querySelectorAll('.star');
    const ratingInput = document.getElementById('rating');
    const submitBtn = document.getElementById('submitBtn');
    const errorEl = document.getElementById('error');

    if (!ticketId) {
      document.getElementById('missing').classList.remove('hidden');
    } else {
      document.getElementById('ticketIdDisplay').textContent = ticketId;
      form.classList.remove('hidden');
    }

    stars.forEach(star => {
      star.addEventListener('click', () => {
        const val = parseInt(star.dataset.value);
        ratingInput.value = val;
        stars.forEach(s => s.classList.toggle('active', parseInt(s.dataset.value) <= val));
      });
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const rating = parseInt(ratingInput.value);
      if (!rating || rating < 1 || rating > 5) { errorEl.textContent = 'Please select a star rating.'; errorEl.classList.remove('hidden'); return; }
      errorEl.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      try {
        const body = JSON.stringify({ args: [ticketId, rating, document.getElementById('comment').value] });
        const res = await fetch('/api/recordSatisfaction', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
        const data = await res.json();
        if (data.success) {
          form.classList.add('hidden');
          document.getElementById('success').classList.remove('hidden');
        } else {
          throw new Error(data.error || 'Failed to submit');
        }
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Feedback';
      }
    });
  </script>
</body>
</html>
